# ShipSync Hub — infra local (`docker compose up -d`)
# Laravel: SESSION_DRIVER=redis, QUEUE_CONNECTION=redis, CACHE_STORE=memcached.
# HTTP + Swagger UI (profile dev): `docker compose --profile dev up -d web` → :8000
# AWS SDK: host usa AWS_ENDPOINT=http://localhost:4566; containers usam http://localstack:4566

x-app-dev: &app-dev
  build:
    context: ./docker/php
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  depends_on:
    redis:
      condition: service_healthy
    memcached:
      condition: service_healthy
    localstack:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - shipsync
  profiles:
    - dev

services:
  # Sessions e jobs do Laravel (QUEUE_CONNECTION=redis por padrão).
  # RabbitMQ é opcional para workers/concorrência — ver RABBITMQ_* e Fase 6.
  # noeviction evita perder chaves de fila Redis.
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - shipsync

  # Cache de cotações (CACHE_STORE=memcached). Volátil de propósito.
  memcached:
    image: docker.io/library/memcached:1.6-alpine
    ports:
      - "11211:11211"
    command: memcached -m 64
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc -w 1 127.0.0.1 11211 | grep -q STAT"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shipsync

  # SQS (+ DLQ), S3, DynamoDB. Lambda sobe on-demand; execução de funções
  # (socket do Podman) fica para um passo seguinte.
  # PHP + Composer para instalar deps e rodar Pest sem PHP no host.
  app:
    <<: *app-dev
    environment:
      REDIS_HOST: redis
      MEMCACHED_HOST: memcached
      AWS_ENDPOINT: http://localstack:4566
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: shipsync
      RABBITMQ_PASSWORD: shipsync

  # Laravel HTTP (API + Swagger UI em /api/documentation).
  web:
    <<: *app-dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      # Sobrescreve REDIS/Memcached/AWS do `.env` (127.0.0.1) com nomes de serviço Docker.
      - docker/env/web.env
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: shipsync
      RABBITMQ_DEFAULT_PASS: shipsync
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shipsync

  localstack:
    image: docker.io/localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,s3,dynamodb,lambda
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - shipsync

networks:
  shipsync:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  localstack_data:
